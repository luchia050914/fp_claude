<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2D6A57">
  <meta name="description" content="FP2級（学科・資産設計提案業務）の再受験対策用オフライン問題集">
  <title>FP2級 再挑戦ドリル</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">FP2級 再挑戦ドリル</h1>
    <span id="netBadge" class="net-badge" role="status" aria-live="polite"></span>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="表示テーマを切り替え">◐</button>
  </header>

  <div id="updateBar" class="update-bar" hidden>
    <span>新しいバージョンがあります。</span>
    <button id="updateBtn" type="button">更新する</button>
  </div>

  <main id="app" tabindex="-1">
    <p class="loading">読み込み中…</p>
  </main>

  <nav class="tabbar" aria-label="画面切り替え">
    <button type="button" data-nav="home">ホーム</button>
    <button type="button" data-nav="stats">成績</button>
    <button type="button" data-nav="review">復習</button>
    <button type="button" data-nav="settings">設定</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p class="noscript">このアプリを使うには、ブラウザのJavaScriptを有効にしてください。</p>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
